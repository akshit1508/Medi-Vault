<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/MediVault/MyCSS/salesreport.css">
    <title>Sales Report</title>
   
    <script>
        function toggleInputs() {
            var reportType = document.getElementById("reportType").value;
            document.getElementById("dayInputs").style.display = "none";
            document.getElementById("monthInputs").style.display = "none";
            document.getElementById("yearInputs").style.display = "none";

            if (reportType === "day") {
                document.getElementById("dayInputs").style.display = "block";
            } else if (reportType === "month") {
                document.getElementById("monthInputs").style.display = "block";
            } else if (reportType === "year") {
                document.getElementById("yearInputs").style.display = "block";
            }
        }
    </script>
</head>
<body onload="toggleInputs()">
    <div class="report-box">
        <h2>Generate Sales Report</h2>
        <form action="/MediVault/Salesreport" method="post">
            <label for="reportType">Select Report Type:</label>
            <select name="reportType" id="reportType" onchange="toggleInputs()" required>
                <option value="day">Day Wise</option>
                <option value="month">Month Wise</option>
                <option value="year">Year Wise</option>
            </select>

            
            <div id="dayInputs">
                <label for="fromDate">From Date:</label>
                <input type="date" name="fromDate">
                <label for="toDate">To Date:</label>
                <input type="date" name="toDate">
            </div>

            
            <div id="monthInputs">
                <label for="fromMonth">From Month:</label>
                <input type="month" name="fromDate">
                <label for="toMonth">To Month:</label>
                <input type="month" name="toDate">
            </div>

         
            <div id="yearInputs">
                <label for="fromYear">From Year:</label>
                <input type="number" name="fromDate" min="2000" max="2100" placeholder="e.g., 2023">
                <label for="toYear">To Year:</label>
                <input type="number" name="toDate" min="2000" max="2100" placeholder="e.g., 2025">
            </div>

            <button type="submit">Generate Report</button>
        </form>
    </div>
</body>
</html>
