<!DOCTYPE html>
<html lang="en">
<head>
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link rel="stylesheet" href="/MediVault/MyCSS/signup.css">
</head>
<body>
    <div class="form-container">
        <h2>User Registration</h2>
        <form action="/MediVault/Signup" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
<div class="form-group">
    <label for="special">Special Name [Mother's Name, DOB, etc. for Recovery]</label>
    <input type="text" id="special" name="special" required>
</div>

     
            <div class="form-group">
                <label for="role">Role:</label>
                <select id="role" name="role" required>
                    <option value="Admin">Admin</option>
                    <option value="Storekeeper">Storekeeper</option>
                </select>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="text" id="phone" name="phone">
            </div>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
