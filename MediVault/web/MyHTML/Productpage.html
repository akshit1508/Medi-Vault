<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link rel="stylesheet" href="/MediVault/MyCSS/ProductPage.css">
</head>

<body>
   
    <h1>Add Product</h1>
    <form action="/MediVault/ProductPage" method="post">
        <label for="id">Product ID:</label>
        <input type="number" id="id" name="id" required><br>

        <label for="name">Product Name:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="batch_number">Batch Number:</label>
        <input type="text" id="batch_number" name="batch_number"><br>

        <label for="category">Category:</label>
        <input type="text" id="category" name="category"><br>

        <label for="drug_type">Drug Type:</label>
        <input type="text" id="drug_type" name="drug_type" required><br>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" step="0.01" required><br>

        <label for="expiry_date">Expiry Date:</label>
        <input type="date" id="expiry_date" name="expiry_date" required><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description"></textarea><br>
        
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" required><br>
        
        <label for="alert_threshold_enable">Enable Alert Threshold:</label>
        <input type="checkbox" id="alert_threshold_enable" name="alert_threshold_enable"><br>

        <label for="alert_threshold">Alert Threshold (must be less than quantity):</label>
        <input type="number" id="alert_threshold" name="alert_threshold" value="10" required><br>

        <label for="expiry_alert">Enable Expiry Alert:</label>
        <input type="checkbox" id="expiry_alert" name="expiry_alert"><br>

        <label for="custom_expiry_alert_date">Custom Expiry Alert Date:</label>
        <input type="date" id="custom_expiry_alert_date" name="custom_expiry_alert_date"><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
