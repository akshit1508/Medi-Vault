<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/MediVault/MyCSS/Forget Password.css">
</head>
<body>
    <div class="form-container">
        <h2>Forgot Password</h2>
        <form action="/MediVault/ForgotPassword" method="post">
            <label for="email">Registered Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Registered Phone:</label>
            <input type="text" id="phone" name="phone" required>
            
            <label for="special">Enter Special Name:</label>
            <input type="text" id="name" name="name" required>

            <button type="submit">Recover Account Details</button>
        </form>
    </div>
</body>
</html>
