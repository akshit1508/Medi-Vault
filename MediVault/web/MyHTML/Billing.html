<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Store Billing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table th, table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        table th {
            background-color: #f1f1f1;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            font-size: 16px;
            margin-right: 10px;
        }
        .form-group input, .form-group select {
            padding: 8px;
            font-size: 16px;
            width: 200px;
        }
        .form-group button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .form-group button:hover {
            background-color: #45a049;
        }
        .total-section {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .total-section p {
            margin: 5px 0;
        }
        .checkout-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .checkout-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Billing System</h2>
        
        <form action="/MediVault/GenerateBillServlet" method="POST">
            <div class="form-group">
                <label for="product">Product:</label>
                <select id="product" name="product_id" required>
                    <option value="">--Select Product--</option>
                    <option value="1" data-price="5">Paracetamol - $5</option>
                    <option value="2" data-price="10">Ibuprofen - $10</option>
                    <option value="3" data-price="8">Aspirin - $8</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity" required min="1">
            </div>

            <div class="form-group">
                <button type="button" onclick="addToCart()">Add to Cart</button>
            </div>
        </form>

        <h3>Shopping Cart</h3>
        <table id="cartTable">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Cart items will be dynamically added here -->
            </tbody>
        </table>

        <div class="total-section">
            <p id="totalLabel">Total: $0</p>
        </div>

        <div class="form-group">
            <button class="checkout-btn" onclick="window.location.href='/MediVault/CheckoutServlet'">Proceed to Checkout</button>
        </div>
    </div>

    <script>
        let total = 0;
        const cartTable = document.getElementById("cartTable").getElementsByTagName('tbody')[0];

        function addToCart() {
            const productSelect = document.getElementById('product');
            const quantityInput = document.getElementById('quantity');

            const productId = productSelect.value;
            const productName = productSelect.options[productSelect.selectedIndex].text;
            const productPrice = parseFloat(productSelect.options[productSelect.selectedIndex].getAttribute('data-price'));
            const quantity = parseInt(quantityInput.value);

            if (productId && quantity > 0) {
                const totalPrice = productPrice * quantity;

                // Add row to the cart table
                const newRow = cartTable.insertRow();
                newRow.innerHTML = `
                    <td>${productName}</td>
                    <td>${quantity}</td>
                    <td>$${productPrice}</td>
                    <td>$${totalPrice}</td>
                    <td><button onclick="removeFromCart(this, ${totalPrice})">Remove</button></td>
                `;

                // Update total
                total += totalPrice;
                document.getElementById('totalLabel').innerText = `Total: $${total.toFixed(2)}`;
            }
        }

        function removeFromCart(button, itemTotal) {
            // Remove row from table
            const row = button.closest('tr');
            row.remove();

            // Update total
            total -= itemTotal;
            document.getElementById('totalLabel').innerText = `Total: $${total.toFixed(2)}`;
        }
    </script>

</body>
</html>
