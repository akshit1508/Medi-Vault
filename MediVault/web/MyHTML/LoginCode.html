<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
      <link rel="stylesheet" href="/MediVault/MyCSS/Login.css">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form action="/MediVault/LoginServlet" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
           
            <button type="submit">Login</button>
        </form>
        <div class="button-container">
         
            <button type="button" onclick="location.href='/MediVault/MyHTML/Signup.html'">Sign Up</button>
            <button type="button" onclick="location.href='/MediVault/MyHTML/Forgetpassword.html'">Forgot Password</button>
        </div>
    </div>
</body>
</html>
